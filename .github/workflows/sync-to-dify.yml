name: Sync to Dify Knowledge

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed markdown files
        id: changed-files
        run: |
          echo "files=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- '*.md' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Notify Dify for each changed file
        env:
          DIFY_WEBHOOK_URL: ${{ secrets.DIFY_WEBHOOK_URL }}
          DIFY_DATASET_ID: ${{ secrets.DIFY_DATASET_ID }}
        run: |
          for file in ${{ steps.changed-files.outputs.files }}; do
            payload=$(jq -n \
              --arg repository "${{ github.repository }}" \
              --arg file_path "$file" \
              --arg branch "${{ github.ref_name }}" \
              --arg commit_sha "${{ github.sha }}" \
              --arg dataset_id "$DIFY_DATASET_ID" \
              --rawfile content "$file" \
              '{repository:$repository, file_path:$file_path, branch:$branch, commit_sha:$commit_sha, content:$content, dataset_id:$dataset_id}')
            curl -sf -X POST "$DIFY_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "$payload"
          done
